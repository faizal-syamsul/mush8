name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Setup Production Keys
        run: |
          # Creates the prod.keys file from your GitHub Secret
          echo "${{ secrets.PROD_KEYS }}" > prod.keys

      - name: Run Build Script
        run: |
          chmod +x ./make-ios.sh
          ./make-ios.sh --ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mush8-ios-ipa
          path: build/Mush8.ipa
