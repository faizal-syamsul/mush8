name: Build iOS IPA
on:
  workflow_dispatch: # Allows you to manually trigger the build

jobs:
  build:
    runs-on: macos-14 # Uses a GitHub-hosted Apple Silicon Mac cloud environment
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Run Build Script
        run: |
          # Executes the repository's native iOS build configuration
          chmod +x ./make-ios.sh
          ./make-ios.sh --ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mush8-ios-ipa
          path: build/Mush8.ipa

